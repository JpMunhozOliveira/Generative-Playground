<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Playground</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extras.css">
</head>

<body>
    <div id="app">
        <aside id="sidebar">
            <div class="header-row">
                <h1>Generative Playground</h1>
                <button id="infoBtn" title="Sobre os experimentos" aria-label="Sobre os experimentos">ℹ️</button>
            </div>

            <div class="control-group">
                <label for="experimentBtn">Experimento</label>
                <button id="experimentBtn" class="experiment-btn" aria-haspopup="dialog" title="Atalho: G">
                    <span id="experimentName"></span><span class="experiment-btn-icon" aria-hidden="true">▦</span>
                </button>
            </div>

            <div id="controlsPanel"></div>

            <div class="control-group export-group">
                <span id="fps"></span>
                <div class="btn-row">
                    <button id="pauseBtn" title="Atalho: Espaço">Pausar</button>
                    <button id="randomBtn" title="Atalho: R">Aleatorizar</button>
                </div>
                <div class="btn-row">
                    <button id="exportBtn">Exportar PNG</button>
                    <button id="linkBtn" title="Copia um link com os parâmetros atuais">Copiar link</button>
                </div>
            </div>
        </aside>

        <main id="viewport">
            <canvas id="renderCanvas"></canvas>
        </main>
    </div>

    <div id="infoModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <span id="closeModal" role="button" aria-label="Fechar">&times;</span>
            <h2 id="modalTitle">Sobre o Experimento</h2>
            <p id="modalDescription"></p>
        </div>
    </div>

    <div id="galleryModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="galleryTitle">
        <div class="modal-content gallery-content">
            <span id="closeGallery" role="button" aria-label="Fechar">&times;</span>
            <h2 id="galleryTitle">Experimentos</h2>
            <div id="galleryGrid" class="gallery-grid"></div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
