<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Playground</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extras.css">
</head>

<body>
    <div id="app">
        <aside id="sidebar">
            <div class="header-row">
                <h1>Generative Playground</h1>
                <button id="infoBtn" title="Sobre os experimentos" aria-label="Sobre os experimentos">ℹ️</button>
            </div>

            <div class="control-group">
                <label for="experimentSelector">Experimento</label>
                <select id="experimentSelector">
                    <option value="mandala">Mandala</option>
                    <option value="particles">Sistema de Partículas</option>
                    <option value="noise">Padrão de Ruído</option>
                    <option value="flowField">Flow Field</option>
                    <option value="attractor">Atrator Caótico</option>
                    <option value="lissajous">Curvas Lissajous</option>
                    <option value="fractalTree">Árvore Fractal</option>
                    <option value="voronoi">Malha Voronoi</option>
                </select>
            </div>

            <div id="controlsPanel"></div>

            <div class="control-group export-group">
                <span id="fps"></span>
                <div class="btn-row">
                    <button id="pauseBtn" title="Atalho: Espaço">Pausar</button>
                    <button id="exportBtn">Exportar PNG</button>
                </div>
            </div>
        </aside>

        <main id="viewport">
            <canvas id="renderCanvas"></canvas>
        </main>
    </div>

    <div id="infoModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <span id="closeModal" role="button" aria-label="Fechar">&times;</span>
            <h2 id="modalTitle">Sobre o Experimento</h2>
            <p id="modalDescription"></p>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
